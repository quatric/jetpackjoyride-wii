name: wii
on:
  push:
    paths: ['wii/**', '.github/workflows/wii.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm ppc-libvorbisidec ppc-libogg
          apt-get update && apt-get install -y zip git
          git clone --depth 1 https://github.com/quatric/libwiiinput ../libwiiinput
          git clone --depth 1 --recurse-submodules https://github.com/quatric/libwiiupdate ../libwiiupdate
          make -C ../libwiiinput
          make -C ../libwiiupdate
      - name: Build the app
        run: make -C wii/app
      - name: Homebrew Channel zip (no game assets)
        run: wii/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jetpackjoyride-wii-hbc
          path: wii/jetpackjoyride-wii-hbc.zip
